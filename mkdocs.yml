site_name: Tech Interview Master
site_description: Interview prep - DSA, System Design, Behavioral, CS Fundamentals, Q&A, Databases. Runnable Python, 21 real system designs, ~194 conceptual Q&A.
site_author: kartikth40
site_url: https://kartikth40.github.io/tech-interview-master/
repo_url: https://github.com/kartikth40/tech-interview-master
repo_name: kartikth40/tech-interview-master
edit_uri: edit/main/
copyright: >
  Tech Interview Master - MIT licensed. Built with MkDocs + Material.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kartikth40/tech-interview-master
      name: GitHub repository
  generator: false

extra_css:
  # highlight.js theme - only applies inside the .py modal (the only place using .hljs)
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css
  - assets/extra.css

extra_javascript:
  # highlight.js core (bundles Python) - loads before extra.js so window.hljs exists
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
  - assets/extra.js

# Use the existing Markdown in place (no separate docs/ folder, no content duplication).
# The same-dir plugin (below) allows docs_dir to be the repo root next to this config.
docs_dir: .
site_dir: site

# Keep meta/config files and the nested leetcode repo out of the built site.
exclude_docs: |
  tasks.md
  CONVERSION_PROGRESS.md
  skeleton.md
  CONTRIBUTING.md
  CODE_OF_CONDUCT.md
  requirements-docs.txt
  # README is the GitHub landing page; the site uses the richer index.md as Home.
  # Anchor to the ROOT readme only - pillar READMEs (Fundamentals/, QA-Bank/, ...) must stay.
  /README.md
  site/
  leetcode-companywise-interview-questions/
  .github/
  .kiro/
  scripts/

theme:
  name: material
  language: en
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.path
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    logo: material/code-braces

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - same-dir
  - gen-files:
      scripts:
        - scripts/gen_code_library.py
  - search
  # Social cards = auto-generated preview image per page for link shares.
  # Requires the imaging extras (Cairo/Pango system libs), which are fragile on
  # Windows and need apt packages in CI. Gated behind CARDS env (default false) so
  # local/dev builds never break; the deploy workflow sets CARDS=true after
  # installing the system deps. See requirements-docs.txt + docs.yml.
  #
  # `enabled` (not just `cards`) is gated on CARDS so the plugin is FULLY inert
  # locally. When only `cards: false` was set, the plugin still wrote to
  # `.cache/plugin/social/` on every build - and because docs_dir is the repo
  # root, `mkdocs serve` watched `.cache`, saw the write, and rebuilt in an
  # infinite loop. Disabling the whole plugin locally stops the cache write.
  - social:
      enabled: !ENV [CARDS, false]
      cards: !ENV [CARDS, false]

